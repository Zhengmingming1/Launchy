name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（例如 0.1.0）"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 确定版本号
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: 编译、签名、打包 DMG
        run: scripts/build-app.sh "${{ steps.v.outputs.version }}" --dmg
      - name: 上传到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          DMG="dist/Launchy-${{ steps.v.outputs.version }}.dmg"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" --title "启动台助手 $TAG" --notes "下载 DMG，把「启动台助手」拖进「应用程序」。首次打开如被拦截，请到「系统设置 → 隐私与安全性」点「仍要打开」。" --target "${{ github.sha }}"
          fi
