# XcodeGen 配置：brew install xcodegen && xcodegen generate
# 会生成 Launchy.xcodeproj，用于打包成正式的 .app
name: Launchy
options:
  bundleIdPrefix: com.launchy
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: zh-Hans
targets:
  Launchy:
    type: application
    platform: macOS
    sources:
      - Sources/Launchy
    settings:
      base:
        PRODUCT_NAME: 启动台助手
        PRODUCT_BUNDLE_IDENTIFIER: com.launchy.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 启动台助手
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSAppleEventsUsageDescription: 修改系统级服务时需要请求管理员权限。
        # 需要读写 ~/Library/LaunchAgents 并调用 launchctl，因此不能开沙盒
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
